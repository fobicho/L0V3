<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buzón</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="floating-hearts">
    <span>♡</span><span>✩</span><span>✧</span><span>☽</span><span>❀</span>
    <span>(˶˃ᆺ˂˶)</span><span>୨ৎ</span><span>ʚɞ</span><span>✿</span><span>★</span>
  </div>

  <div class="login-container">
    <div class="login-box">

      <div id="error-msg" class="error-msg"></div>

      <form id="login-form">
        <div class="form-group login-field">
          <input type="text" id="secret" placeholder=" ">
          <label for="secret">Tu código secreto</label>
        </div>
        <button type="submit" class="btn btn-primary">-Ingresar-</button>
      </form>

      <p id="hint-text" class="hint-text">Es nuestra fecha más importante (formato: DD/MM/AAAA)</p>
    </div>
  </div>

  <button class="pista-fixed" id="pista-btn">Pista</button>

  <script src="js/config.js?v=4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/api.js?v=4"></script>
  <script src="js/login.js?v=5"></script>
</body>
</html>
