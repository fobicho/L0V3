<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buzón</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="floating-hearts">
    <span>♡</span><span>✩</span><span>✧</span><span>☽</span><span>❀</span>
    <span>(˶˃ᆺ˂˶)</span><span>୨ৎ</span><span>ʚɞ</span><span>✿</span><span>★</span>
  </div>

  <div class="login-container">
    <div class="login-box">

      <div id="error-msg" class="error-msg"></div>

      <form id="login-form">
        <div class="form-group login-field">
          <input type="text" id="secret" placeholder=" ">
          <label for="secret">Tu código secreto</label>
        </div>
        <button type="submit" class="btn btn-primary">-Ingresar-</button>
      </form>

      <p id="hint-text" class="hint-text">Es nuestra fecha más importante (formato: DD/MM/AAAA)</p>
    </div>
  </div>

  <button class="pista-fixed" id="pista-btn">Pista</button>

  <script src="js/config.js?v=4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/api.js?v=4"></script>
  <script>
    let pistaCount = 0;
    const pistaBtn = document.getElementById('pista-btn');
    const hintText = document.getElementById('hint-text');

    pistaBtn.addEventListener('click', () => {
      pistaCount++;
      const pop = document.createElement('div');
      pop.className = 'click-popup';
      pop.textContent = pistaCount;

      const rect = pistaBtn.getBoundingClientRect();
      const offsetX = Math.random() * 110;
      const offsetY = Math.random() * 90;
      pop.style.left = (rect.left + offsetX) + 'px';
      pop.style.top = (rect.top - 24 - offsetY) + 'px';

      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 1000);

      if (pistaCount === 25) {
        showPistaMessage('¡Tu puedes llegar a 100!');
      }

      if (pistaCount >= 100) {
        hintText.classList.add('show');
      }
    });

    function showPistaMessage(text) {
      const msg = document.createElement('div');
      msg.className = 'pista-msg';
      msg.textContent = text;

      const rect = pistaBtn.getBoundingClientRect();
      msg.style.left = (rect.right + 24) + 'px';
      msg.style.top = (rect.top - 10) + 'px';

      document.body.appendChild(msg);
      setTimeout(() => msg.remove(), 2500);
    }

    if (getToken()) {
      const payload = parseJWT(getToken());
      if (payload && payload.role === 'admin' && payload.exp * 1000 > Date.now()) {
        window.location.href = '/admin';
      } else if (payload && payload.exp * 1000 > Date.now()) {
        let target = null;
        try { target = sessionStorage.getItem('redirectAfterLogin'); } catch {}
        if (target) { try { sessionStorage.removeItem('redirectAfterLogin'); } catch {} window.location.href = target; }
        else { window.location.href = '/'; }
      } else {
        clearToken();
        sessionStorage.removeItem('role');
      }
    }

    function goAfterLogin(data) {
      let target = null;
      try { target = sessionStorage.getItem('redirectAfterLogin'); } catch {}
      try { sessionStorage.removeItem('redirectAfterLogin'); } catch {}

      if (data.role === 'admin') {
        if (target && target.startsWith('/admin')) {
          window.location.href = target;
        } else {
          window.location.href = '/admin';
        }
      } else {
        if (target && !target.startsWith('/admin')) {
          window.location.href = target;
        } else {
          window.location.href = '/';
        }
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const secret = document.getElementById('secret').value;
      const errorEl = document.getElementById('error-msg');

      try {
        const data = await login(secret);
        goAfterLogin(data);
      } catch (err) {
        errorEl.textContent = err.message || 'Error de conexión';
        errorEl.classList.add('show');
      }
    });
  </script>
</body>
</html>
