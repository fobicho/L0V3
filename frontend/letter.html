<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buzón</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="floating-hearts">
    <span>♡</span><span>✩</span><span>✧</span><span>☽</span><span>❀</span>
    <span>(˶˃ᆺ˂˶)</span><span>୨ৎ</span><span>ʚɞ</span><span>✿</span><span>★</span>
  </div>

  <div class="letter-container">
    <a href="/cartas" class="back-btn">← Volver</a>

    <div id="letter-content">
      <div class="loading"><img class="brand-icon loading-heart" src="icon.png" alt=""><p>Cargando carta...</p></div>
    </div>
  </div>

  <script src="js/config.js?v=4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/api.js?v=4"></script>
  <script>
    async function loadLetter() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) { window.location.href = '/cartas'; return; }
      localStorage.setItem('read_' + id, '1');
      markLetterRead(id).catch(function() {});

      const container = document.getElementById('letter-content');
      try {
        const data = await apiRead('/' + encodeURIComponent(id));

        container.innerHTML = `
          <div class="letter-paper">
            <div class="letter-header">
              <h1 class="letter-title">${escapeHTML(data.title)}</h1>
              <div class="letter-divider"></div>
            </div>
            <div class="letter-content">${escapeHTML(data.content)}</div>
            ${data.images && data.images.length
              ? '<div class="letter-gallery">' + data.images.map(src =>
                  '<img class="gallery-img" src="' + escapeHTML(src) + '" alt="Ampliar foto">').join('') + '</div>'
              : ''}
            <div class="letter-footer">
              <div class="letter-divider"></div>
              <span class="letter-date">${formatDate(data.created_at)}</span>
            </div>
          </div>
        `;
        document.title = `${data.title} — Cartas para mi Novia`;
      } catch (err) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-emoji">😢</div>
            <h3>Carta no encontrada</h3>
            <p>${err.message || err}</p>
          </div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadLetter);
  </script>
</body>
</html>
