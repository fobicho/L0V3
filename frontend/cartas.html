<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buzón</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <style id="auth-visibility">html { visibility: hidden; }</style>
  <script>
    (function () {
      var token = localStorage.getItem('token');
      var valid = false;
      try {
        var payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        valid = payload.exp * 1000 > Date.now();
      } catch (_) {}
      if (valid && payload.role === 'admin') {
        location.replace('/admin');
      } else if (valid) {
        document.getElementById('auth-visibility').remove();
      }
      else {
        try { sessionStorage.setItem('redirectAfterLogin', location.pathname + location.search); } catch (_) {}
        location.replace('/login');
      }
    }());
  </script>
</head>
<body>
  <button class="sidebar-toggle" type="button" aria-label="Abrir menú" aria-expanded="false">☰</button>
  <aside class="sidebar">
    <div class="sidebar-counter">
      <h2>Nuestro tiempo juntos</h2>
      <div class="counter-grid">
        <div class="counter-item"><span id="c-years">0</span><small>Años</small></div>
        <div class="counter-item"><span id="c-months">0</span><small>Meses</small></div>
        <div class="counter-item"><span id="c-days">0</span><small>Días</small></div>
        <div class="counter-item"><span id="c-hours">0</span><small>Horas</small></div>
        <div class="counter-item"><span id="c-minutes">0</span><small>Minutos</small></div>
        <div class="counter-item"><span id="c-seconds">0</span><small>Segundos</small></div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="/" class="nav-link">Inicio</a>
      <a href="/cartas" class="nav-link active">Buzón</a>
    </nav>
    <button class="logout-fixed" onclick="logout()">Cerrar sesión</button>
  </aside>

  <div class="floating-hearts">
    <span>♡</span><span>✩</span><span>✧</span><span>☽</span><span>❀</span>
    <span>(˶˃ᆺ˂˶)</span><span>୨ৎ</span><span>ʚɞ</span><span>✿</span><span>★</span>
  </div>

  <main class="content">
    <div class="content-inner content-inner--top">
      <div id="letters-grid" class="cards-grid">
        <div class="loading"><img class="brand-icon loading-heart" src="icon.png" alt=""><p>Cargando cartas...</p></div>
      </div>
    </div>
  </main>

  <script src="js/config.js?v=4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/api.js?v=4"></script>
  <script src="js/ui-utils.js?v=5"></script>
  <script src="js/letter-renderer.js?v=5"></script>
  <script src="js/app.js?v=4"></script>
  <script src="js/layout.js?v=4"></script>
</body>
</html>
